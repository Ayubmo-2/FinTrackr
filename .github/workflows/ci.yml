name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fintrackr_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate
        env:
          DATABASE_URL: postgresql://dev:devpassword@localhost:5432/fintrackr_test

      - name: Run migrations
        run: cd server && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dev:devpassword@localhost:5432/fintrackr_test

      - name: Run backend tests
        run: cd server && npm test
        env:
          DATABASE_URL: postgresql://dev:devpassword@localhost:5432/fintrackr_test
          ACCESS_TOKEN_SECRET: test_access_secret_32chars_minimum_ok
          REFRESH_TOKEN_SECRET: test_refresh_secret_32chars_minimum_ok
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRO_PRICE_ID: price_placeholder
          CLIENT_URL: http://localhost:5173
          MAILTRAP_USER: placeholder
          MAILTRAP_PASS: placeholder

      - name: Install client deps
        run: cd client && npm ci

      - name: Build frontend
        run: cd client && npm run build
        env:
          VITE_API_URL: /api
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Railway
        run: echo "Configure: install railway CLI and run railway up"

      - name: Deploy frontend to Vercel
        run: echo "Configure: install vercel CLI and run vercel deploy --prod"
